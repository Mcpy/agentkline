[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkline-engine-core"
version = "0.1.0"
description = "AgentKline engine framework: contract, matching core, metrics, CLI (no backend deps)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentKline Team" }]
dependencies = []

[project.scripts]
ak-engine = "agentkline_engine.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["agentkline_engine", "agentkline_engine.drivers"]

[tool.setuptools.package-data]
agentkline_engine = ["py.typed"]
