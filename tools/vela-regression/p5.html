<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>P5 — bundle 集成（原生 JS 页共存 + API 覆盖 + 体积）</title>
<style>
body{background:#14161a;color:#ddd;font:12px monospace;margin:0}
.fake-ui{border:1px solid #333;border-radius:6px;padding:8px;margin:6px;background:#1b1e24}
#chart{width:100%;height:480px}
#results{white-space:pre-wrap;padding:8px;border-top:1px solid #333}
</style></head>
<body>
<div style="display:flex;gap:8px;padding:6px">
  <div class="fake-ui" style="flex:1">
    <b>假身份证卡（模拟现有 UI 组件）</b>
    <div>binance: BTC/USDT 永续 · 1d</div>
    <div>O 83,461.10  H 84,465.30  L 82,724.30</div>
  </div>
  <div class="fake-ui" style="flex:1">
    <b>假雷达列表</b>
    <div>· BTC/USDT 永续  +1.12%</div>
    <div>· ETH/USDT 永续  -0.34%</div>
  </div>
</div>
<div id="chart"></div>
<div id="results">running…</div>
<script src="./package/dist/vela.global.min.js"></script>
<script src="./mock-data.js"></script>
<script>
const R = [];
const log = (...a) => { R.push(a.join(' ')); document.getElementById('results').textContent = R.join('\n'); console.log(...a); };
const V = window.Vela;
const t0 = performance.now();

(async () => {
    try {
        const chart = new V.Vela('#chart', { data: MOCK.ohlcv.slice(), symbol: 'MOCK/USD', timeframe: '1d', theme: 'dark' });
        await chart.ready();
        log('图表与假 UI 组件同页共存 ok（原生 JS + script 标签，零构建链）');
        log('加载→ready 耗时(ms):', (performance.now() - t0).toFixed(0));

        // API 覆盖打勾（P1–P4 所需）
        const NEED = {
            'P1 registerNativeIndicator': typeof V.registerNativeIndicator,
            'P1 registerRendererLayer': typeof V.registerRendererLayer,
            'P1 registerChartType': typeof V.registerChartType,
            'P2 MarketDataFeed(deps 注入)': 'port(类型层)+p2 实测',
            'P3 chart.drawings.add': typeof chart.drawings.add,
            'P3 chart.drawings.toJSON': typeof chart.drawings.toJSON,
            'P3 chart.drawings.fromJSON': typeof chart.drawings.fromJSON,
            'P4 chart.marks.add': typeof chart.marks.add,
            'P4 chart.marks.defineGroup': typeof chart.marks.defineGroup,
            'P4 mark:click 事件': 'p4 实测 fired',
            '视口 setVisibleRange': typeof chart.setVisibleRange,
            '事件总线 chart.on': typeof chart.on,
        };
        for (const [k, v] of Object.entries(NEED)) log('覆盖', k, '=', v);
        const missing = Object.entries(NEED).filter(([k, v]) => v === 'undefined');
        log('P5 结论：bundle 覆盖 ' + (Object.keys(NEED).length - missing.length) + '/' + Object.keys(NEED).length
            + (missing.length ? '，缺: ' + missing.map(m => m[0]).join(',') : '，全在')
            + '；体积 min=960K(≤2MB 软线内)；workspace 不在 global bundle（独立 ESM 模块）');
    } catch (e) { log('P5 ERROR:', e && e.message); }
})();
</script>
</body>
</html>
