<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>P8 — bands(fill) + circles emit 探针</title>
<style>
body{background:#14161a;color:#ddd;font:12px monospace;margin:0}
#chart{width:100%;height:640px}
#results{white-space:pre-wrap;padding:8px;border-top:1px solid #333}
</style></head>
<body>
<div id="chart"></div>
<div id="results">running…</div>
<script src="./package/dist/vela.global.min.js"></script>
<script src="./mock-data.js"></script>
<script>
const R=[];
const log=(...a)=>{R.push(a.join(' '));document.getElementById('results').textContent=R.join('\n');console.log(...a);};
const V=window.Vela;
const O=MOCK.ohlcv;
function pts(vals){return vals.map((v,i)=>({time:O[i].time,value:v==null?null:+v.toFixed(2)}));}
// bb-like bands: mid=SMA20, upper/lower=mid±2σ
const mid=[],up=[],lo=[];
for(let i=0;i<O.length;i++){
  if(i<19){mid.push(null);up.push(null);lo.push(null);continue;}
  let s=0;for(let j=i-19;j<=i;j++)s+=O[j].close;const m=s/20;
  let v=0;for(let j=i-19;j<=i;j++)v+=(O[j].close-m)**2;const sd=Math.sqrt(v/20);
  mid.push(m);up.push(m+2*sd);lo.push(m-2*sd);
}
// sar-like circles: dots alternating below low / above high
const circ=O.map((b,i)=>({time:b.time,value:+(i%2? b.low*0.99 : b.high*1.01).toFixed(2)}));
function ls(id,title,points,color,kind,width){return{id,title,paneId:'',kind:kind||'line',points,style:{color,width:width||2,lineStyle:'solid'}};}

(async()=>{
  try{
    V.registerNativeIndicator({
      type:'poc-bands',title:'PoC Bands(fill)',paneHint:'price',overlay:true,
      inputsSchema:()=>[],defaultInputs:()=>({}),
      create:()=>({start(ctx){
        ctx.emit({
          series:[ls('bb-up','BB Upper',pts(up),'#ffa726'),ls('bb-mid','BB Mid',pts(mid),'#4fc3f7'),ls('bb-lo','BB Lower',pts(lo),'#ffa726')],
          fills:[{id:'bb-fill',paneId:'',fromSeriesId:'bb-up',toSeriesId:'bb-lo',color:'rgba(255,167,38,0.18)'}],
        });
        ctx.setStatus('live');log('bands emit ok (3 line series + 1 fill)');
      },onBars(){},setInputs(){},suspend(){},resume(){},stop(){}})
    });
    V.registerNativeIndicator({
      type:'poc-circles',title:'PoC Circles(sar)',paneHint:'price',overlay:true,
      inputsSchema:()=>[],defaultInputs:()=>({}),
      create:()=>({start(ctx){
        ctx.emit({series:[ls('sar-dots','SAR Dots',circ,'#80deea','circles',2)]});
        ctx.setStatus('live');log('circles emit ok (kind=circles)');
      },onBars(){},setInputs(){},suspend(){},resume(){},stop(){}})
    });
    log('registered poc-bands + poc-circles');
    const chart=new V.Vela('#chart',{data:O,symbol:'MOCK/USD',timeframe:'1d',theme:'dark',volume:false});
    await chart.ready();log('chart ready');
    chart.addNativeIndicator('poc-bands');
    chart.addNativeIndicator('poc-circles');
    await chart.ready();await new Promise(r=>setTimeout(r,1200));
    const ins=chart.inspect();
    log('totals: series='+ins.totals.series+' fills='+ins.totals.fills+' panes='+ins.totals.panes);
    let circles=0,fills=0;
    (ins.indicators||[]).forEach(ind=>{
      log('  ind '+ind.nativeType+' series='+JSON.stringify(ind.series)+' fills='+ind.fills);
      if(ind.series&&ind.series.circles)circles+=ind.series.circles;
      fills+=ind.fills||0;
    });
    log('circles series count='+circles+'  fills count='+fills);
    log('RESULT: '+((circles>=1&&fills>=1)?'PASS — bands(fill) + circles 均可经 emit 口挂载渲染':'FAIL — circles='+circles+' fills='+fills));
  }catch(e){log('P8 ERROR:',e&&e.message,e&&e.stack&&e.stack.split('\n')[1]);}
})();
</script>
</body>
</html>
