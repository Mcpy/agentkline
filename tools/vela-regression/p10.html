<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>P10 — 原生画线子系统（工具栏/flyout/交互放置/设置/撤销）</title>
<style>
body{background:#14161a;color:#ddd;font:12px monospace;margin:0}
#chart{width:100%;height:640px}
#results{white-space:pre-wrap;padding:8px;border-top:1px solid #333}
</style></head>
<body>
<div id="chart"></div>
<div id="results">running…</div>
<script src="./package/dist/vela.global.min.js"></script>
<script src="./mock-data.js"></script>
<script>
const R=[];
const log=(...a)=>{R.push(a.map(String).join(' '));document.getElementById('results').textContent=R.join('\n');console.log(...a);};
const V=window.Vela, O=MOCK.ohlcv;
window.__P10={done:false,result:null}; window.__P10_PHASE=null;
const waitPhase=async(name)=>{ window.__P10_PHASE=name; while(window.__P10_PHASE===name) await new Promise(r=>setTimeout(r,80)); };
const rect=s=>{const e=document.querySelector(s);return e?e.getBoundingClientRect():null;};
const clip=r=>r?[Math.round(r.left),Math.round(r.top),Math.round(r.width),Math.round(r.height)]:null;

(async()=>{
  const out={};
  try{
    const chart=new V.Vela('#chart',{data:O,symbol:'MOCK/USD',timeframe:'1d',theme:'dark',volume:false});
    await chart.ready(); await new Promise(r=>setTimeout(r,600));
    out.supported=!!(chart.drawings&&chart.drawings.supported);
    log('drawings.supported='+out.supported);

    // ── A 工具栏 DOM / gutter ──
    const tb=document.querySelector('.vela-dtb');
    const tbRect=tb?tb.getBoundingClientRect():null;
    const cells=[...document.querySelectorAll('.vela-dtb-cell')];
    const groups=cells.filter(c=>{const l=c.querySelector('button')?.getAttribute('aria-label')||'';return l&&l!=='Magnet snap';});
    const gutter=getComputedStyle(document.getElementById('chart')).getPropertyValue('--vela-toolbar-gutter').trim();
    out.toolbar={exists:!!tb,width:tbRect?Math.round(tbRect.width):0,cells:cells.length,groups:groups.length,
      labels:groups.map(c=>c.querySelector('button')?.getAttribute('aria-label')||''),
      gutter,canvas:clip(rect('canvas'))};
    log('A toolbar='+JSON.stringify(out.toolbar));
    const A=!!tb&&Math.round(tbRect.width)===44&&groups.length===7&&gutter==='44px';

    // ── B flyout（真实鼠标悬停由 runner 代劳） ──
    await waitPhase('hover');
    await new Promise(r=>setTimeout(r,250));
    const flyout=document.querySelector('.vela-dtb-flyout');
    const items=flyout?[...flyout.querySelectorAll('.vela-dtb-item')]:[];
    out.flyout={open:!!flyout,count:items.length,
      labels:items.slice(0,6).map(e=>(e.getAttribute('aria-label')||e.getAttribute('title')||e.textContent.trim()))};
    log('B flyout='+JSON.stringify(out.flyout));
    const B=!!flyout&&items.length>=9;
    await waitPhase('unhover');   // runner moves mouse away

    // ── C 交互放置：trendline 两次点击（runner 真实鼠标） ──
    const before=chart.drawings.all().length;
    let createdEvt=null; chart.on('drawing:created',e=>{createdEvt=e;});
    chart.drawings.setTool('trendline');
    await new Promise(r=>setTimeout(r,150));
    await waitPhase('click');
    const after=chart.drawings.all().length;
    const placed=chart.drawings.all().find(d=>d.type==='trendline');
    out.place={before,after,createdEvent:!!createdEvt,anchors:placed?placed.anchors.length:0,id:placed&&placed.id};
    log('C place='+JSON.stringify(out.place));
    const C=after===before+1&&!!placed&&placed.anchors.length===2;

    // ── D 程序化 add（Fib）+ 序列化 ──
    const fib=chart.drawings.add('fibretracement',{paneId:'price',anchors:[
      {time:O[440].time,price:O[440].low},{time:O[470].time,price:O[470].high}]});
    const doc=chart.drawings.toJSON();
    out.add={fib:!!fib,docVersion:doc&&doc.version,total:doc&&doc.drawings.length,
      types:(doc&&doc.drawings||[]).map(d=>d.type),styleKeys:fib?Object.keys(fib.style):[]};
    log('D add='+JSON.stringify(out.add));
    const D=!!fib&&doc.version===1&&out.add.types.includes('fibretracement')&&out.add.styleKeys.includes('lineColor');

    // ── E 快捷条 + 齿轮设置面板 ──
    chart.drawings.openSettings(fib.id);
    await new Promise(r=>setTimeout(r,500));
    const bar=document.querySelector('.vela-dpop');
    out.quickBar={open:!!bar,rect:clip(bar&&bar.getBoundingClientRect())};
    let dsp=null,hasShowOn=false;
    if(bar){ await waitPhase('gear'); }
    await new Promise(r=>setTimeout(r,600));
    dsp=document.querySelector('.vela-dsp');
    if(dsp) hasShowOn=/Show on/.test(dsp.textContent||'');
    const dspRect=dsp?dsp.getBoundingClientRect():null;
    const inside=dspRect?dspRect.left>=-1&&dspRect.top>=-1&&dspRect.right<=innerWidth+1&&dspRect.bottom<=innerHeight+1:false;
    out.settings={barOpen:!!bar,panelOpen:!!dsp,rect:clip(dspRect),inside,hasShowOn,
      controls:[...document.querySelectorAll('.vela-dsp .vela-dsp-lab')].slice(0,8).map(e=>e.textContent.trim())};
    log('E settings='+JSON.stringify(out.settings));
    const E=!!bar&&!!dsp&&inside;
    await waitPhase('shot');

    // ── F 撤销/重做 + fromJSON 清历史（已确认的坑） ──
    chart.drawings.select([]);
    const canUndo1=chart.drawings.canUndo();
    chart.drawings.undo(); await new Promise(r=>setTimeout(r,200));
    const afterUndo=chart.drawings.all().length;
    chart.drawings.redo(); await new Promise(r=>setTimeout(r,200));
    const afterRedo=chart.drawings.all().length;
    const beforeReload=chart.drawings.canUndo();
    chart.drawings.fromJSON(chart.drawings.toJSON());
    const afterReload=chart.drawings.canUndo();
    out.undo={canUndo1,afterUndo,afterRedo,beforeReload,afterReload,clearsHistory:beforeReload&&!afterReload};
    log('F undo='+JSON.stringify(out.undo));
    const F=canUndo1&&afterUndo<afterRedo;

    // ── G 文字工具 + 样式持久化 ──
    const txt=chart.drawings.add('text',{paneId:'price',anchors:[{time:O[430].time,price:O[430].low}],
      text:{value:'P10 文本',size:'normal',hAlign:'center',vAlign:'center',color:'#ffffff'}});
    const reread=(chart.drawings.all()||[]).find(d=>d.id===(txt&&txt.id));
    out.text={ok:!!txt},out.text.value=reread&&reread.text&&reread.text.value;
    log('G text='+JSON.stringify(out.text));
    const G=!!txt&&out.text.value==='P10 文本';

    out.assertions={A,B,C,D,E,F,G};
    out.pass=A&&B&&C&&D&&E&&F&&G;
    log('RESULT: '+(out.pass?'PASS':'PARTIAL')+' '+JSON.stringify(out.assertions));
  }catch(e){
    log('P10 ERROR: '+(e&&e.message));
    out.error=String(e&&e.stack||e);
  }
  window.__P10={done:true,result:out};
})();
</script>
</body>
</html>
