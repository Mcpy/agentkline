# AgentKline 配置示例
# 复制为 config.yaml 后修改。真实 config.yaml 含 token，已被 .gitignore 忽略，切勿提交。
# 双端口：web 面向用户浏览器（无鉴权），agent 面向 AI agent（全量鉴权 + /mcp）。
# 各自 host/port 可独立配置，也可被环境变量覆盖：
#   AGENTKLINE_WEB_HOST / AGENTKLINE_WEB_PORT / AGENTKLINE_AGENT_HOST / AGENTKLINE_AGENT_PORT
server:
  web:
    host: "0.0.0.0"
    port: 8765
  agent:
    host: "127.0.0.1"   # agent 端口默认仅本机；如需远程 agent 改为 0.0.0.0 并务必配置 auth.token
    port: 8766

scripts:
  dir: "./scripts"
  # L1 沙箱：直接 exec（内部调试用）
  sandbox_level: 1

# v0.4 性能三件套（R8）限额
limits:
  max_window: 5000          # 指标重算尾窗（根数）；脚本长记忆参数勿超窗
  max_bars_per_slot: 50000  # 每槽上限：越界截最旧 + dropped 回报（防 AI 手滑大内嵌）
  init_window: 2000         # init/switch 携带窗口=最近 N 根；左滚历史走 backfill 按需

# 鉴权（可选但强烈建议）。agent 端口全部接口需 Bearer 此 token；
# 不设置则 agent 端口仅本机可用。环境变量 AGENTKLINE_TOKEN 优先级更高。
auth:
  token: "CHANGE_ME_to_a_random_token"
